<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Shooter Arcade</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background: #1a1a2e;
            border: 4px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            display: block;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 600px;
            padding: 10px 0;
            font-size: 20px;
            font-weight: bold;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 500px;
            background: rgba(15, 15, 26, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #e94560;
            margin-bottom: 10px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>SCORE: <span id="score-val">0</span></div>
        <div>LIVES: <span id="lives-val">3</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="500"></canvas>
        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const livesVal = document.getElementById('lives-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // Game Configuration & State
        let gameActive = true;
        let score = 0;
        let lives = 3;
        let spawnTimer = 0;
        let spawnInterval = 90; // Frames between chicken spawns

        // Player configuration
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 50,
            width: 40,
            height: 30,
            speed: 6,
            color: '#00fff5'
        };

        // Entities arrays
        let lasers = [];
        let chickens = [];

        // Track keyboard inputs
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            KeyA: false,
            KeyD: false,
            Space: false
        };

        // Event Listeners
        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));
        restartBtn.addEventListener('click', resetGame);

        function handleKey(e, isPressed) {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = isPressed;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = isPressed;
            
            // Fire laser instantly on initial space down to prevent sluggish controls
            if (e.code === 'Space') {
                if (isPressed && !keys.Space && gameActive) {
                    fireLaser();
                }
                keys.Space = isPressed;
            }
        }

        function fireLaser() {
            lasers.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 15,
                speed: 8,
                color: '#ff007f'
            });
        }

        function spawnChicken() {
            const size = 30;
            const x = Math.random() * (canvas.width - size);
            chickens.push({
                x: x,
                y: -size,
                width: size,
                height: size,
                speed: 2 + Math.random() * 1.5,
                color: '#ffbe0b'
            });
        }

        // Standard bounding box collision check
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (!gameActive) return;

            // 1. Move Player
            if (keys.ArrowLeft && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys.ArrowRight && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // 2. Update Lasers (Traverse and check bounds)
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].y -= lasers[i].speed;
                if (lasers[i].y < 0) {
                    lasers.splice(i, 1);
                }
            }

            // 3. Spawn Chickens
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnChicken();
                spawnTimer = 0;
                // Gradually speed up spawning as player scores
                spawnInterval = Math.max(40, 90 - Math.floor(score / 5) * 5);
            }

            // 4. Update Chickens & Check Collisions
            for (let i = chickens.length - 1; i >= 0; i--) {
                const chicken = chickens[i];
                chicken.y += chicken.speed;

                // Check collision with player
                if (checkCollision(chicken, player)) {
                    chickens.splice(i, 1);
                    lives--;
                    livesVal.textContent = lives;
                    if (lives <= 0) endGame();
                    continue;
                }

                // Check if chicken reached the bottom line
                if (chicken.y > canvas.height) {
                    chickens.splice(i, 1);
                    lives--;
                    livesVal.textContent = lives;
                    if (lives <= 0) endGame();
                    continue;
                }

                // Check collision with lasers
                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (checkCollision(lasers[j], chicken)) {
                        chickens.splice(i, 1);
                        lasers.splice(j, 1);
                        score++;
                        scoreVal.textContent = score;
                        break;
                    }
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars background effect (static styling)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for(let i=0; i<20; i++) {
                ctx.fillRect((i*37)%canvas.width, (i*73)%canvas.height, 2, 2);
            }

            // Draw Player Spaceship
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Draw Lasers
            lasers.forEach(laser => {
                ctx.fillStyle = laser.color;
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
            });

            // Draw Chickens (Simple retro shape rendering)
            chickens.forEach(chicken => {
                // Chicken Body
                ctx.fillStyle = chicken.color;
                ctx.fillRect(chicken.x, chicken.y, chicken.width, chicken.height);
                
                // Comb (Red Top)
                ctx.fillStyle = '#e94560';
                ctx.fillRect(chicken.x + chicken.width/3, chicken.y - 4, chicken.width/3, 4);

                // Beak (Orange)
                ctx.fillStyle = '#ff6b81';
                ctx.fillRect(chicken.x + chicken.width - 4, chicken.y + chicken.width/3, 4, 6);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            finalScore.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            lives = 3;
            spawnInterval = 90;
            spawnTimer = 0;
            lasers = [];
            chickens = [];
            player.x = canvas.width / 2 - 20;
            scoreVal.textContent = score;
            livesVal.textContent = lives;
            gameOverScreen.style.display = 'none';
            gameActive = true;
        }

        // Initialize the Game
        gameLoop();
    </script>
</body>
</html>
